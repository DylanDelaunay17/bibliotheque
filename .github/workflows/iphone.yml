# Appli iPhone : compile un .ipa non signé (SideStore le signe avec le compte Apple gratuit)
# et le publie avec la source SideStore dans la version « iphone » du dépôt.
# Seul le code natif est dans l'.ipa : l'appli affiche le site en ligne, mis à jour sans réinstaller.
name: Appli iPhone

on:
  push:
    branches: [main]
    paths: ['iphone/**', '.github/workflows/iphone.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iphone
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
      BASE: https://github.com/${{ github.repository }}/releases/download/iphone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Projet Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Compilation (sans signature)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Fichier .ipa et source SideStore
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qry Biblio.ipa Payload)
          SIZE=$(stat -f%z out/Biblio.ipa) node sidestore-source.mjs > out/sidestore.json

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view iphone >/dev/null 2>&1 || gh release create iphone --title "Appli iPhone" --notes "Installation et mises à jour par SideStore : voir iphone/README.md."
          gh release upload iphone out/Biblio.ipa out/sidestore.json --clobber
